<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1864969470317711">
    <link rel="icon" type="image/x-icon" href="/assets/images/emblems/icon.svg">
    <title>PROP - Quiz</title>
    <link rel="stylesheet" href="/styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1864969470317711"
        crossorigin="anonymous"></script>

    <!-- Load Component Partials -->
    <script type="module" src="/js/components/header.js"></script>
    <script type="module" src="/js/components/footer.js"></script>
    <script type="module" src="/js/pages/modal-element.js"></script>
</head>

<body>

    <site-header></site-header>

    <main>
        <!-- QUIZ RUNNER VIEW -->
<section id="quiz-view" class="col">
    <!-- Timed Evaluation Banner -->
    <div id="eval-timer-banner" class="quiz-card" style="display: none; justify-content: space-between; align-items: center; padding: 0.6em 1em; margin-bottom: 0.8em; border: 2px solid #f85149; background: rgba(248, 81, 73, 0.1);">
        <div style="font-weight: bold; color: #f85149; display: flex; align-items: center; gap: 0.4em;">
            <span>EVALUATION MODE</span>
        </div>
        <div style="font-size: 1.2rem; font-family: monospace; font-weight: bold;" id="quiz-countdown-timer">
            --:--
        </div>
    </div>

    <!-- Header Bar -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8em; gap: 0.5em;">
        <!-- Top Left Cluster: Badge & Exit Button Under Title -->
        <div style="display: flex; flex-direction: column; gap: 0.4em; align-items: flex-start;">
            <span id="quiz-standard-badge" class="quiz-card-badge">[MODULE: UNSET]</span>
            <button id="btn-quiz-exit" class="btn-tactical btn-red btn-sm" type="button">
                Exit Session
            </button>
        </div>
        
        <!-- Top Right Cluster: Question Tracker & Jump Dropdown Underneath -->
        <div style="display: flex; flex-direction: column; gap: 0.4em; align-items: flex-end;">
            <span id="question-tracker" style="font-weight: bold; font-size: 0.85rem;">Question 1 of X</span>
            <select id="question-jump-select" style="padding: 0.3em 0.5em; font-size: 0.85rem; font-weight: bold; border-radius: 4px; border: 1px solid var(--border-color);">
                <!-- Dynamically Populated -->
            </select>
        </div>
    </div>

    <h1 id="question-text" style="font-size: 1.2rem; line-height: 1.4; margin-bottom: 0.8em;">
        Loading question prompt...
    </h1>

    <div id="options-container"></div>
    <div id="feedback-panel" class="hidden"></div>

    <!-- Navigation Controls -->
    <div style="display: flex; gap: 0.5em; margin-top: 1em;">
        <button id="prev-question-btn" class="btn-tactical btn-lg btn-clear" type="button" style="flex: 2;" disabled>
            ◀ Previous
        </button>
        <button id="next-question-btn" class="btn-tactical btn-lg btn-blue" type="button" style="flex: 2;">
            Next ▶
        </button>
    </div>
</section>

    </main>

    <custom-modal></custom-modal>
    <site-footer></site-footer>

    <script src="/js/profanity-filter.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>

</html>
