<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1864969470317711">
    <link rel="icon" type="image/x-icon" href="/assets/images/emblems/icon.svg">
    <title>Practice</title>
    <link rel="stylesheet" href="/styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1864969470317711"
        crossorigin="anonymous"></script>

    <!-- Load Component Partials -->
    <script type="module" src="/js/components/header.js"></script>
    <script type="module" src="/js/components/footer.js"></script>
    <script type="module" src="/js/pages/modal-element.js"></script>
</head>

<body>

    <site-header>
        <!-- Static Skeleton Shell (Prevents Header Glitch) -->
        <nav id="navbar">
            <div class="nav-links">
                <a href="index.html" class="active-nav">Home</a>
                <a href="setup.html">Practice</a>
                <a href="leaderboard.html">Leaderboard</a>
            </div>
            <div class="nav-search-wrapper">
                <input type="text" class="nav-search-input" placeholder="Search Subjects..." disabled />
            </div>
            <div class="nav-controls">
                <div class="badge-status badge-verified nav-pts-badge">⭐ ...</div>
            </div>
        </nav>
    </site-header>

    <main>
        <!-- QUIZ RUNNER VIEW -->
        <section id="quiz-view" class="col">
            <!-- Timed Evaluation Banner -->
            <div id="eval-timer-banner" class="quiz-card eval-banner hidden">
                <div class="eval-banner-label">
                    <span>EVALUATION MODE</span>
                </div>
                <div id="quiz-countdown-timer" class="eval-timer-display">
                    --:--
                </div>
            </div>

            <!-- Header Bar -->
            <div class="quiz-runner-header">
                <!-- Top Left Cluster: Badge & Exit Button Under Title -->
                <div class="quiz-cluster-left">
                    <span id="quiz-standard-badge" class="quiz-card-badge">[MODULE: UNSET]</span>
                    <button id="btn-quiz-exit" class="btn-tactical btn-red btn-sm" type="button">
                        Exit Session
                    </button>
                </div>

                <!-- Top Right Cluster: Question Tracker & Jump Dropdown Underneath -->
                <div class="quiz-cluster-right">
                    <span id="question-tracker" class="quiz-tracker-text">Question -- of --</span>
                    <select id="question-jump-select" class="quiz-jump-select">
                        <!-- Dynamically Populated -->
                    </select>
                </div>
            </div>

            <h1 id="question-text" class="quiz-question-prompt">
                Loading question prompt...
            </h1>

            <div id="options-container"></div>
            <div id="feedback-panel" class="hidden"></div>

            <!-- Navigation Controls -->
            <div class="quiz-nav-row">
                <button id="prev-question-btn" class="btn-tactical btn-lg btn-clear flex-2" type="button" disabled>
                    ◀ Previous
                </button>
                <button id="next-question-btn" class="btn-tactical btn-lg btn-blue flex-2" type="button">
                    Next ▶
                </button>
            </div>
        </section>
    </main>

    <custom-modal></custom-modal>
    <site-footer></site-footer>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>

</html>
