<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1864969470317711">
    <link rel="icon" type="image/x-icon" href="/assets/images/emblems/icon.svg">
    <title>PROP - Start Quiz</title>
    <link rel="stylesheet" href="../styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1864969470317711"
        crossorigin="anonymous"></script>

    <!-- Load Component Partials -->
    <script type="module" src="/js/partials/header.js"></script>
    <script type="module" src="/js/partials/footer.js"></script>
</head>

<body>

    <site-header></site-header>

    <main>
        <section id="setup-view" class="col">
  <!-- Top Banner Header -->
  <div id="subject-banner" class="subject-banner-container">
    <div class="banner-overlay"></div>
    <h1 class="banner-title">Subject Configuration</h1>
  </div>

  <!-- Main Content Layout Grid -->
  <div class="setup-grid">
    <!-- Left Column: Settings -->
    <div class="setup-config-col">
      <label for="quiz-select" class="form-label">Subject:</label>
      <select id="quiz-select"></select>

      <label for="name" class="form-label">Name (Leaderboard):</label>
      <input type="text" id="name" placeholder="e.g., C/SrA Smith or TSgt Davis">

      <div class="slider-wrapper">
        <div class="slider-header">
          <label for="quiz-question-count-slider" class="form-label">Question Count:</label>
          <span id="quiz-question-count-label" class="slider-value">0 Questions</span>
        </div>
        <input type="range" id="quiz-question-count-slider" min="1" max="1" value="1">
      </div>
    </div>

    <!-- Right Column: Mode Action Buttons -->
    <div class="setup-actions-col">
      <button id="btn-mode-test" class="btn-tactical btn-blue btn-lg">
        Play as Test
      </button>

      <button id="btn-mode-study" class="btn-tactical btn-gold btn-lg">
        Study Mode
      </button>

      <button id="btn-mode-flashcards" class="btn-tactical btn-lg">
        Flash Cards
      </button>
    </div>
  </div>
</section>

        <section id="select-view" class="col">
            <h1>Subjects & quizzes</h1>
            <div id="quiz-cards-grid" class="cards-grid">
                <div class="text-center">Loading available subjects...</div>
            </div>
        </section>
    </main>

    <site-footer></site-footer>

    <script src="/js/profanity-filter.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>

</html>
