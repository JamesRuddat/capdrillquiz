<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1864969470317711">
    <link rel="icon" type="image/x-icon" href="/assets/images/emblems/icon.svg">
    <title>PROP - Start Quiz</title>
    <link rel="stylesheet" href="../styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1864969470317711"
        crossorigin="anonymous"></script>

    <!-- Load Component Partials -->
    <script type="module" src="/js/partials/header.js"></script>
    <script type="module" src="/js/partials/footer.js"></script>
</head>

<body>

    <site-header></site-header>

    <main>
        <section id="setup-view" class="col">
            <h1>Study CONFIGURATION</h1>
            <div style="width: 50%;">
                <label for="quiz-select">Target Quiz Module:</label>
                <select id="quiz-select"></select>

                <label for="name">Name & Rank (Leaderboard):</label>
                <input type="text" id="name" placeholder="e.g., C/SrA Smith or TSgt Davis">

                <div style="margin: 1em 0;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3em;">
                        <label for="quiz-question-count-slider">Question Count:</label>
                        <span id="quiz-question-count-label">0 Questions</span>
                    </div>
                    <input type="range" id="quiz-question-count-slider" min="1" max="1" value="1"
                        style="width: 100%; cursor: pointer;">
                </div>

                <button id="btn-begin-assessment" class="btn-tactical btn-blue">Begin Assessment</button>
            </div>
        </section>

        <section id="select-view" class="col">
            <h1>Modules & quizzes</h1>
            <div id="quiz-cards-grid" class="cards-grid">
                <div class="text-center">Loading available modules...</div>
            </div>
        </section>
    </main>

    <site-footer></site-footer>

    <script src="/js/profanity-filter.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>

</html>
