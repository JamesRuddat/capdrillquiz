<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1864969470317711">
    <link rel="icon" type="image/x-icon" href="/assets/images/emblems/icon.svg">
    <title>Start Practice</title>
    <link rel="stylesheet" href="/styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1864969470317711"
        crossorigin="anonymous"></script>

    <!-- Load Component Partials -->
    <script type="module" src="/js/components/header.js"></script>
    <script type="module" src="/js/components/footer.js"></script>
    <script type="module" src="/js/pages/modal-element.js"></script>
</head>

<body>

    <site-header></site-header>

    <main>
        <section id="setup-view" class="col">
            <!-- Top Banner Header -->
            <div id="subject-banner" class="subject-banner-container">
                <div class="banner-overlay"></div>
                <h1 class="banner-title">Subject Configuration</h1>
            </div>

            <!-- Main Content Layout Grid -->
            <div class="setup-grid">
                <!-- Left Column: Settings -->
                <div class="setup-config-col">
                    <label for="quiz-select" class="form-label">Subject:</label>
                    <select id="quiz-select"></select>

                    <label for="eval-time-select" class="form-label">
                        Duration (Milestone Mode):
                    </label>
                    <select id="eval-time-select" class="setup-select">
                        <option value="15">15 Minutes</option>
                        <option value="20">20 Minutes</option>
                        <option value="25">25 Minutes</option>
                        <option value="30" selected>30 Minutes (Standard)</option>
                        <option value="45">45 Minutes</option>
                        <option value="60">60 Minutes (Milestone)</option>
                    </select>

                    <div class="slider-wrapper">
                        <div class="slider-header">
                            <label for="quiz-question-count-slider" class="form-label">Question Count:</label>
                            <span id="quiz-question-count-label" class="slider-value">1 Question</span>
                        </div>
                        <input type="range" id="quiz-question-count-slider" min="1" max="1" value="1">
                    </div>
                </div>

                <!-- Right Column: Mode Action Buttons -->
                <div class="setup-actions-col">
                    <button id="btn-mode-test" class="btn-tactical btn-blue btn-lg" type="button">
                        Test Mode
                    </button>

                    <button id="btn-mode-study" class="btn-tactical btn-gold btn-lg" type="button">
                        Study Mode
                    </button>

                    <button id="btn-mode-flashcards" class="btn-tactical btn-lg" type="button">
                        Flash Cards
                    </button>
                </div>
            </div>

            <hr>
            <div id="subject-desc" class="setup-description-container"></div>
        </section>

        <section id="select-view" class="col">
            <div id="quiz-cards-grid" class="cards-grid">
                <div class="text-center">Loading available subjects...</div>
            </div>
        </section>
    </main>

    <custom-modal></custom-modal>
    <site-footer></site-footer>

    <script src="/js/profanity-filter.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>

</html>
