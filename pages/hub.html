<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1864969470317711">
    <link rel="icon" type="image/x-icon" href="/assets/images/emblems/icon.svg">
    <title>PROP - Quiz Hub</title>
    <link rel="stylesheet" href="../styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1864969470317711"
        crossorigin="anonymous"></script>

    <!-- Load Component Partials -->
    <script type="module" src="/js/partials/header.js"></script>
    <script type="module" src="/js/partials/footer.js"></script>
</head>

<body>

    <site-header></site-header>

    <main>
        <section id="hub-view" class="col">
            <h1>QUIZ CREATOR & HUB</h1>
            <p style="font-size: 0.8rem; color: var(--light-text-color);">
                Create modules, append questions, inspect community items, or manage database records.
            </p>

            <div id="hub-auth-status" class="advisory" style="margin-bottom: 1em;">
                Status: Guest
            </div>

            <hr>

            <div
                style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 0.8em; gap: 0.5em;">
                <h1 style="margin: 0;">Module &amp; Questions</h1>
                <hr>
                <div style="display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap;">
                    <button id="btn-create-module-card" class="btn-tactical btn-gold" style="padding: 0.4em 0.8em;">
                        ➕ Create New Module
                    </button>
                </div>

                <div style="display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap;">
                    <label for="bank-inspect-select" style="font-size: 0.8rem; margin: 0;">Edit Selected Module:</label>
                    <select id="bank-inspect-select" style="width: auto; padding: 0.3em; margin: 0;"></select>
                    <button id="btn-delete-module" class="btn-tactical btn-clear hidden">
                        Delete Module
                    </button>
                </div>
            </div>

            <div
                style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin: 1em 0 0.8em 0; gap: 0.5em; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 1em;">
                <h2 style="margin: 0; font-size: 1.2rem;">Module Questions</h2>
                <div style="display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap;">
                    <button id="btn-add-question-card" class="btn-tactical btn-gold" style="padding: 0.4em 0.8em;">
                        ➕ Add Question Card
                    </button>
                </div>
            </div>

            <div id="bank-inspector-list">
                <div style="color: var(--light-text-color); font-size: 0.8rem;">Select a module above to manage or
                    inspect questions...</div>
            </div>
        </section>
    </main>

    <site-footer></site-footer>

    <script src="/js/profanity-filter.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>

</html>
