<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1864969470317711">
    <link rel="icon" type="image/x-icon" href="/assets/images/emblems/icon.svg">
    <title>PROP - Profile</title>
    <link rel="stylesheet" href="/styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1864969470317711"
        crossorigin="anonymous"></script>

    <!-- Load Component Partials -->
    <script type="module" src="/js/components/header.js"></script>
    <script type="module" src="/js/components/footer.js"></script>
    <script type="module" src="/js/pages/modal-element.js"></script>
</head>

<body>
    <site-header></site-header>

    <main>
        <!-- Guest Fallback -->
        <div id="profile-guest-notice" class="card text-center hidden">
            <h2>Authentication Required</h2>
            <p class="profile-subtext">Please sign in with Google to view your profile, stats, and badges.</p>
            <button id="profile-signin-btn" class="btn-tactical btn-gold profile-signin-btn" type="button">
                Sign In with Google
            </button>
        </div>

        <!-- Authenticated Profile View -->
        <div id="profile-content" class="hidden">
            <!-- Header Card -->
            <div class="card profile-header-card">
                <div>
                    <span class="quiz-card-badge">RECORD</span>
                    <h1 id="profile-callsign-display" class="profile-callsign">---</h1>
                    <p id="profile-uid-display" class="profile-uid"></p>
                </div>
                <div class="profile-header-actions">
                    <div class="text-center profile-stars-box">
                        <div class="profile-stat-label">LIFETIME STARS</div>
                        <div id="profile-points-display" class="profile-stars-value">⭐ 0</div>
                    </div>
                    <br>
                    <button id="btn-change-callsign" class="btn-tactical btn-sm" type="button">
                        Edit Callsign
                    </button>
                </div>
            </div>

            <!-- Stats Overview -->
            <div class="profile-stats-grid">
                <div class="card text-center">
                    <div class="profile-stat-label">EVALUATIONS COMPLETED</div>
                    <div id="stat-evals-count" class="profile-stat-value">0</div>
                </div>
                <div class="card text-center">
                    <div class="profile-stat-label">TOTAL CORRECT ANSWERS</div>
                    <div id="stat-correct-count" class="profile-stat-value">0</div>
                </div>
            </div>

            <!-- Badges & Achievements Showcase -->
            <section class="card profile-section-margin">
                <h2 class="profile-section-title">ACHIEVEMENTS & MILESTONES</h2>
                <div id="user-badges-grid">
                    <p class="profile-subtext">Loading achievements...</p>
                </div>
            </section>
        </div>
    </main>

    <custom-modal></custom-modal>
    <site-footer></site-footer>

    <script type="module" src="/js/pages/profile-page.js"></script>

    <script src="/js/profanity-filter.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
