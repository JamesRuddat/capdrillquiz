<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1864969470317711">
    <link rel="icon" type="image/x-icon" href="/assets/images/emblems/icon.svg">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1864969470317711"
        crossorigin="anonymous"></script>

    <!-- Load Component Partials -->
    <script type="module" src="/js/components/header.js"></script>
    <script type="module" src="/js/components/footer.js"></script>
    <script type="module" src="/js/pages/modal-element.js"></script>
</head>

<body>

    <site-header></site-header>

    <main>
        <section id="leaderboard-view" class="col">
            <div class="leaderboard-header-row">
                <div>
                    <h1 class="margin-none">Leaderboard</h1>
                    <p class="leaderboard-subtext">
                        Sign in to claim your callsign on the public rankings!
                    </p>
                </div>

                <div class="leaderboard-filter-controls">
                    <div class="leaderboard-control-group">
                        <label for="leaderboard-mode-select" class="leaderboard-label">Type:</label>
                        <select id="leaderboard-mode-select" class="leaderboard-select">
                            <option value="test-scores">Top Evaluations</option>
                            <option value="user-points">Most Lifetime Points ⭐</option>
                        </select>
                    </div>
                    <br>
                    <div id="subject-filter-wrapper" class="leaderboard-control-group">
                        <label for="filter-leaderboard" class="leaderboard-label">Subject:</label>
                        <select id="filter-leaderboard" class="leaderboard-select">
                            <option value="ALL">All Subjects</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="leaderboard-disclaimer-wrapper">
                <p class="leaderboard-disclaimer">
                    * Entries prior to the 3.9.1 update have been automatically altered.
                </p>
            </div>

            <table id="leaderboard-table">
                <thead id="leaderboard-thead">
                    <tr>
                        <th class="sortable" data-sort="name">Callsign </span></th>
                        <th class="sortable" data-sort="module">Subject </span></th>
                        <th class="sortable" data-sort="score">Score </span></th>
                        <th class="sortable" data-sort="date">Date </span></th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="4" class="text-center text-dim">
                            Connecting to cloud database...
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <custom-modal></custom-modal>
    <site-footer></site-footer>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>

</html>
