<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill & Ceremonies Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav id="navbar">
        <div class="nav-links">
            <a href="/index.html">home</a>
            <a onclick="showView('setup-view')">Quiz Setup</a>
            <a onclick="showView('leaderboard-view')">Leaderboard</a>
        </div>
        <div class="nav-controls">
            <button class="theme-toggle-btn" onclick="toggleTheme()">Toggle Theme</button>
        </div>
    </nav>

    <h1 id="fancyboi">DRILL_AND_CEREMONIES_EVALUATOR_v1.0</h1>
    <hr>

    <!-- SETUP VIEW -->
    <div id="setup-view" class="col">
        <div class="notice-message">Select your branch of service to initiate evaluation.</div>
        
        <label for="cadet-name">Cadet / Service Member Name:</label>
        <input type="text" id="cadet-name" placeholder="e.g., C/SrA Smith">

        <label for="branch-select">Branch Standard:</label>
        <select id="branch-select">
            <option value="USAF">US Air Force / Space Force (AFMAN 36-2203)</option>
            <option value="USA">US Army (TC 3-21.5)</option>
            <option value="USMC">US Marine Corps / Navy (MCO 5060.2M)</option>
        </select>

        <button onclick="startQuiz()">Start Drill Quiz</button>
    </div>

    <!-- QUIZ VIEW -->
    <div id="quiz-view" class="col" style="display:none;">
        <div id="question-tracker" class="timestamp">Question 1 of 3</div>
        <h2 id="question-text">Question goes here...</h2>
        <div id="options-container"></div>
    </div>

    <!-- RESULTS VIEW -->
    <div id="results-view" class="col" style="display:none;">
        <div class="advisory text-center">EVALUATION COMPLETE</div>
        <p class="text-center" id="score-summary" style="font-size: 1.2rem; margin-top: 1em;"></p>
        <div class="text-center">
            <button onclick="showView('leaderboard-view')">View Leaderboard</button>
            <button onclick="showView('setup-view')">Retake Quiz</button>
        </div>
    </div>

    <!-- LEADERBOARD VIEW -->
    <div id="leaderboard-view" class="col" style="display:none;">
        <h2>Service-Wide Leaderboard</h2>
        <label for="filter-branch">Filter by Branch:</label>
        <select id="filter-branch" onchange="renderLeaderboard()">
            <option value="ALL">All Branches</option>
            <option value="USAF">USAF / USSF</option>
            <option value="USA">US Army</option>
            <option value="USMC">USMC / USN</option>
        </select>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Score</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
        <br>
        <button onclick="clearScores()" class="btn-clear">Clear Score Log</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
